{% set name = "xorg-libXScrnSaver" %}
{% set version = "1.2.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: 5057365f847253e0e275871441e10ff7846c8322a5d88e1e187d326de1cd8d00

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11 aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
  host:
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-libxext {{ xorg_libxext }}
    - xorg-util-macros ==1.20.2

test:
  commands:
    - test -f $PREFIX/lib/libXss.dylib  # [osx]
    - test -f $PREFIX/lib/libXss.so     # [linux]

about:
  home: https://www.x.org/
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxscrnsaver
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxscrnsaver
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: The X.org X11 Xlib-based X11 Screen Saver extension client library
  description: The X.org X11 Xlib-based X11 Screen Saver extension client library

extra:
  recipe-maintainers:
    - zklaus
